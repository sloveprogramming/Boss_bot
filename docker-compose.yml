# AI 招聘助手 — 精简架构一键部署
# 旧微服务 Agent（orchestrator, resume-parser, classifier, analyzers）已废弃
# 招聘流程引擎已内嵌至 Backend (LangGraph)
# 端口: backend=18000, rag-service=18003, frontend=18016
# 所有 Dockerfile 已统一到项目根目录（Dockerfile.backend / Dockerfile.rag）
# requirements 已按服务拆分（backend/requirements.txt / rag_service/requirements.txt）
# 所有 .env 已统一到根目录

services:
  # ==================== 主后端（招聘流程引擎） ====================
  backend:
    build:
      context: .                        # 构建上下文为项目根目录
      dockerfile: Dockerfile.backend    # 引用根目录的 Dockerfile
    ports:
      # Dockerfile.backend 内 uvicorn 监听 8000，宿主机暴露为 18000
      - "18000:8000"
    env_file:
      - .env                            # 从根目录 .env 加载所有环境变量
    environment:
      # 容器内服务发现：Milvus 走容器网络名
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      # 主业务数据库：容器内通过服务名访问 MySQL
      - DATABASE_URL=mysql+aiomysql://root:123456@mysql:3306/recruit_ai?charset=utf8mb4
      # 消息队列（高并发防护）：容器内通过服务名访问
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==================== RAG 服务（企业制度智能问答） ====================
  rag-service:
    build:
      context: .                        # 构建上下文为项目根目录
      dockerfile: Dockerfile.rag        # 引用根目录的 Dockerfile
    ports:
      - "18003:18003"
    env_file:
      - .env                            # 从根目录 .env 加载所有环境变量
    environment:
      # 容器内服务发现：Milvus 走容器网络名
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - DATABASE_URL=mysql+aiomysql://root:123456@mysql:3306/recruit_ai?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    restart: unless-stopped

  # ==================== 前端 ====================
  # 前端 Dockerfile 待添加（建议 nginx + 静态文件，参考 Dockerfile.frontend）
  # 当前如需启用，请先在 frontend/ 目录下创建 Dockerfile 并取消下面注释
  # frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #   ports:
  #     - "18016:18016"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

  # ==================== 主业务数据库 (MySQL) ====================
  mysql:
    image: mysql:8.0
    container_name: recruit-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: recruit_ai
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ==================== 向量数据库 (Milvus + MinIO) ====================
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  milvus-standalone:
    container_name: milvus
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ==================== 消息队列（高并发防护） ====================
  # 把「简历分析」这类重负载从 HTTP 请求中剥离，由 worker 有界并发消费，
  # 避免高并发（几千份简历同时分析）时瞬间打爆 LLM API 与数据库。
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"      # AMQP 端口（backend / worker 连接）
      - "15672:15672"    # 管理后台（可选访问）
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==================== 后端 Worker（消费分析队列） ====================
  # 与 backend 共享 .env 与 MySQL，独立进程运行 python -m app.queue.worker
  backend-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m app.queue.worker
    env_file:
      - .env
    environment:
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - DATABASE_URL=mysql+aiomysql://root:123456@mysql:3306/recruit_ai?charset=utf8mb4
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_uploads:
  mysql_data:
  milvus_data:
  minio_data:
  rabbitmq_data:
