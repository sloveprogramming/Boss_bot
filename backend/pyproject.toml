[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boos-backend"
version = "1.0.0"
description = "AI ?????? ? ????FastAPI + LangGraph ??????"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "sqlalchemy>=2.0.51",
    "aiosqlite>=0.22.0",
    "aiomysql>=0.3.0",
    "pymysql>=1.1.0",
    "openai>=2.45.0",
    "langgraph>=1.2.0",
    "langchain-text-splitters>=1.1.0",
    "pymilvus>=2.6.0,<3.0",
    "mcp>=1.28.0",
    "python-docx>=1.2.0",
    "PyMuPDF>=1.28.0",
    "aio-pika>=9.4.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "twilio>=9.3.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.32",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "jinja2>=3.1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
