[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boos-rag-service"
version = "1.0.0"
description = "??????? RAG ?????Milvus + BGE-M3 + ???? + SSE?"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "sqlalchemy>=2.0.51",
    "aiosqlite>=0.22.0",
    "openai>=2.45.0",
    "langchain-core>=1.4.0",
    "langchain-text-splitters>=1.1.0",
    "pymilvus>=2.6.0,<3.0",
    "milvus-model>=0.1.0",
    "tiktoken>=0.13.0",
    "sentence-transformers>=5.6.0",
    "redis>=8.0.0",
    "numpy>=2.5.0",
    "python-docx>=1.2.0",
    "PyMuPDF>=1.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
